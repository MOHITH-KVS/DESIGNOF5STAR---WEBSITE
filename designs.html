<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designs - DesignsOf5Star</title>
    <link rel="stylesheet" href="designs.css">
    <script defer src="designs.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            <img src="./assests/MY LOGO.jpg" alt="5Star Logo">
            <span class="logo-text">
                <span>D</span><span>e</span><span>s</span><span>i</span><span>g</span><span>n</span>
                <span>o</span><span>f</span>
                <span>5</span><span>S</span><span>t</span><span>a</span><span>r</span>
            </span>
        </div>
        
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="aboutus.html">About Us</a>
            <a href="services.html" target="_blank">Services</a>
            <a href="#designs">Designs</a>
            <a href="resources.html">Resources</a>
            <a href="help.html">Help</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <!-- Category Buttons -->
    <section class="categories">
        <div class="category-container">
            <button data-category="all" class="category-btn active">All</button>
            <button data-category="social" class="category-btn">Social Media Posters</button>
            <button data-category="branding" class="category-btn">Branding Posters</button>
            <button data-category="website" class="category-btn">Website UI</button>
            <button data-category="app" class="category-btn">App UI</button>
            <button data-category="video" class="category-btn">Video Posters</button>
            <button data-category="services" class="category-btn">Services Posters</button>
            <button data-category="promotion" class="category-btn">Promotion Posters</button>
            <button data-category="fest" class="category-btn">Fest Posters</button>
            <button data-category="visiting" class="category-btn">Visiting Cards</button>
            <button data-category="landing" class="category-btn">Landing Pages</button>
            <button data-category="menu-designs" class="category-btn">Food Menu</button>
        </div>
    </section> 

    <!-- Design Gallery -->
    <section id="designGallery" class="gallery">
        <!-- Dynamic designs will be inserted here -->
    </section>

        <!-- Modal (Design Preview) -->
    <div id="modal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content" role="document">
            <button id="closeModal" class="close-btn" aria-label="Close Modal">&times;</button>
            <div class="modal-body">
                <!-- Left Side: Image -->
                <div class="modal-left">
                    <img id="modalImage" src="" alt="Full Design" loading="lazy">
                    <span class="watermark">DesignsOf5Star</span> 
                </div>
                <!-- Right Side: Design Details -->
                <div class="modal-right">
                    <h2 id="designTitle" class="design-title"></h2>
                    <p id="designDescription" class="design-description"></p>
                    <p><strong>Category:</strong> <span id="designCategory"></span></p>
                    <p><strong>Designer:</strong> <span id="designerDetails"></span></p>
                    <p><strong>Design Links:</strong> <a href="#" id="designLinks" target="_blank">View</a></p>
                    <p><strong>Social Links:</strong> <a href="#" id="socialLinks" target="_blank">View</a></p>
                    <div class="modal-buttons">
                        <a href="#" id="contactBtn" class="btn contact-btn">Contact Us</a>
                        <a href="#" id="buyNowBtn" class="btn buy-btn">Buy Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer>
        <p>&copy; 2025 DesignsOf5Star | All rights reserved.</p>
    </footer>
</body>
</html>
